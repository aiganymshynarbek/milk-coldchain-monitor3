# Local Jenkins server for the CI/CD pipeline.
#   1. set REPO_URL to your GitHub repository (in a .env file or the shell)
#   2. docker compose -f docker-compose.jenkins.yml up -d --build
#   3. open http://localhost:8080  (login admin / admin unless changed)
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    user: root            # needed to use the host Docker socket; acceptable for a local test server
    ports:
      - "8080:8080"
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/YOUR_USERNAME/milk-coldchain-monitor.git}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
